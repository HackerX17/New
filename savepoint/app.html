<title>Savepoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cormorant+Garamond:wght@600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Jost:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar; nav rail on desktop, bottom tab bar on phones; one scrolling column of views.
   Three skins, each taken from an app you already made: Night Arcade (your games), Star Atlas (Synastry Score), Kinetic. */
:root{
  color-scheme:dark;
  --bg:#0a0420;--panel:#130a35;--panel2:#1d1249;--line:#33266b;--ink:#fff6e6;--muted:#c0b5e2;--dim:#9a8fc8;
  --a1:#00f0ff;--on-a1:#04021a;--a2:#ff2bd6;--a3:#7dff3a;--gold:#ffd23f;--bad:#ff7a88;--ok:#7dff3a;
  --wash:radial-gradient(900px 520px at 92% -12%,rgba(255,43,214,.16),transparent 62%),radial-gradient(800px 520px at -12% 108%,rgba(0,240,255,.11),transparent 60%);
  --display:"Audiowide","Arial Black",system-ui,sans-serif;--body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --hw:400;--ht:uppercase;--hls:.03em;--hs:1;
  --r:14px;--rl:20px;--glow:0 0 20px rgba(0,240,255,.3);
  --cs:88%;--cl:62%;--cover-ink:rgba(8,3,28,.86);
  --b1:#338ced;--b2:#e76624;--b3:#00a888;--b4:#d28e05;--b5:#e24d8b;--b6:#0aac23;--b7:#9887ef;--b8:#eb6263;
}
:root[data-skin="atlas"]{
  --bg:#0c1a20;--panel:#12262e;--panel2:#183039;--line:#2a4954;--ink:#eef2ea;--muted:#aec2c2;--dim:#8ea6a6;
  --a1:#f2c94c;--on-a1:#241a00;--a2:#ff8fa3;--a3:#7cc6fe;--gold:#f2c94c;--bad:#ff6b5b;--ok:#7cc6fe;
  --wash:radial-gradient(1200px 600px at 80% -10%,#173640 0%,transparent 60%);
  --display:"Cormorant Garamond",Georgia,serif;--body:"Manrope",system-ui,sans-serif;
  --hw:700;--ht:none;--hls:0;--hs:1.22;
  --r:16px;--rl:22px;--glow:none;
  --cs:40%;--cl:40%;--cover-ink:rgba(244,240,226,.92);
}
:root[data-skin="kinetic"]{
  --bg:#07070a;--panel:#0e0e13;--panel2:#17171e;--line:#2a2a33;--ink:#ffffff;--muted:#b0b0ba;--dim:#8f8f9a;
  --a1:#d4ff3a;--on-a1:#07070a;--a2:#ff5a36;--a3:#3ad6ff;--gold:#ffd23f;--bad:#ff7a7a;--ok:#d4ff3a;
  --wash:linear-gradient(transparent,transparent);
  --display:"Geist",system-ui,sans-serif;--body:"Geist",system-ui,sans-serif;
  --hw:600;--ht:none;--hls:-.02em;--hs:1;
  --r:12px;--rl:18px;--glow:none;
  --cs:72%;--cl:60%;--cover-ink:rgba(7,7,10,.86);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--wash),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
a{color:var(--a1)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:var(--hw);text-transform:var(--ht);letter-spacing:var(--hls);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:calc(clamp(26px,4.2vw,36px) * var(--hs))}
h2{font-size:calc(clamp(19px,2.6vw,23px) * var(--hs))}
h3{font-size:calc(16px * var(--hs))}
p{margin:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:14px}.xs{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
kbd{font:500 11.5px/1 var(--mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}

/* ---------- buttons, fields, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;background:var(--a1);color:var(--on-a1);font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:var(--glow);position:relative}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--panel2);filter:none}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad);color:#1c0306;box-shadow:none}
.btn .i{width:18px;height:18px}
.btn[aria-disabled=true]{opacity:.55;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--panel2)}
.iconbtn[aria-pressed=true]{color:var(--a1);border-color:var(--a1)}
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.field{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px;color:var(--ink)}
.field::placeholder{color:var(--dim)}
textarea.field{resize:vertical;line-height:1.45}
select.field{padding-right:32px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--panel2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.bc[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#0b0614}
.chip.bc::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.chip.bc[aria-pressed=true]::before{background:#0b0614}
.chip.xs{min-height:32px;padding:0 10px;font-size:13px}
.chip .i{width:16px;height:16px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.seg button{min-height:36px;padding:0 13px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:18px}
.lbl{display:block;font:600 13px/1.3 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.mbar{height:10px;border-radius:9px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.mbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.mbar.sm{height:6px}
.bchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bchip::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.bchip.none{--c:var(--dim);color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;min-height:62px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:var(--hw) calc(19px * var(--hs)) var(--display);text-transform:var(--ht);letter-spacing:var(--hls);white-space:nowrap}
.logo svg{width:34px;height:34px;flex:none}
.savechip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.savechip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip[data-s=demo]::before{background:var(--gold)}
.savechip[data-s=saving]::before{background:var(--a3)}
.savechip[data-s=error]::before,.savechip[data-s=none]::before{background:var(--bad)}
.spacer{flex:1}
.lvl{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 10px 4px 4px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.lvl:hover{background:var(--panel2)}
.lvb{display:grid;place-items:center;min-width:36px;height:34px;padding:0 6px;border-radius:10px;background:var(--a1);color:var(--on-a1);font:600 13px/1 var(--mono)}
.xpw{display:grid;gap:4px;width:118px}
.xpt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpw .mbar{height:6px}
.streak{display:inline-flex;align-items:center;gap:3px;font:600 13px var(--mono);color:var(--gold)}
.streak .i{width:16px;height:16px}
.streak.off{color:var(--dim)}
.skinwrap{position:relative}
.skinmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:min(310px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:grid;gap:4px}
.skinopt{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-align:left}
.skinopt:hover{background:var(--panel2)}
.skinopt[aria-pressed=true]{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--a1)}
.skinopt b{display:block;font-size:15px}
.sk-sw{width:42px;height:42px;border-radius:10px;flex:none;border:1px solid rgba(255,255,255,.15)}
.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1440px;margin:0 auto}
.rail{display:none}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel);color:var(--ink)}
.nav a[aria-current=page]{background:var(--panel2);color:var(--ink)}
.nav a[aria-current=page] .i{color:var(--a1)}
.nav .badge{margin-left:auto;font:600 12px var(--mono);color:var(--on-a1);background:var(--a1);padding:2px 7px;border-radius:999px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}
.tabbar a[aria-current=page]{color:var(--a1)}
main{padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
@media(min-width:900px){
  .shell{grid-template-columns:228px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);align-self:start;height:calc(100vh - 63px - env(safe-area-inset-top,0px));padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:8px}
  .tabbar{display:none}
  main{padding-block:24px 64px;padding-left:16px}
}
@media(max-width:899.98px){.savechip{display:none}}
@media(max-width:560px){.xpw{display:none}.logo span{display:none}.imp span{display:none}.imp{padding:0 12px}}
.rail-foot{margin-top:auto;padding:12px;border-radius:var(--r);border:1px dashed var(--line);font-size:13px;color:var(--muted)}

/* ---------- page heads ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head>div:first-child{display:grid;gap:6px;max-width:68ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px}
.back .i{width:16px;height:16px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 9%,var(--panel))}
.banner p{flex:1 1 280px;font-size:14.5px}
.banner b{color:var(--gold)}

/* ---------- covers (generated art: Instagram exports carry no images) ---------- */
.cover{position:relative;display:block;aspect-ratio:4/5;border-radius:calc(var(--r) - 4px);overflow:hidden;background:linear-gradient(150deg,hsl(var(--h1) var(--cs) var(--cl)),hsl(var(--h2) var(--cs) calc(var(--cl) - 13%)))}
.cover::before{content:"";position:absolute;inset:0;opacity:.5}
.p0::before{background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,transparent 5px 15px)}
.p1::before{background:radial-gradient(rgba(255,255,255,.45) 1.6px,transparent 2.2px) 0 0/14px 14px}
.p2::before{background:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px) 0 0/18px 18px}
.p3::before{background:repeating-radial-gradient(circle at 85% 15%,rgba(255,255,255,.25) 0 2px,transparent 2px 13px)}
.p4::before{background:conic-gradient(rgba(255,255,255,.17) 25%,transparent 0 50%,rgba(255,255,255,.17) 0 75%,transparent 0) 0 0/22px 22px}
.p5::before{background:repeating-linear-gradient(-28deg,transparent 0 10px,rgba(255,255,255,.2) 10px 12px,transparent 12px 22px)}
.cover .mono{position:absolute;left:10px;bottom:6px;font:var(--hw) 44px/1 var(--display);color:var(--cover-ink);text-transform:uppercase;letter-spacing:var(--hls)}
.cover.big .mono{font-size:clamp(64px,12vw,104px);left:18px;bottom:12px}
.cover .kind{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:600}
.cover .kind .i{width:12px;height:12px}
.cover .rate{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.6);color:#ffd23f;font:600 11.5px var(--mono)}
.cover .rate .i{width:12px;height:12px}

/* ---------- library ---------- */
.inbox{display:grid;gap:14px 24px;grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:720px){.inbox{grid-template-columns:auto minmax(0,1fr) auto}}
.inbox .big{font:var(--hw) calc(40px * var(--hs))/1 var(--display);letter-spacing:var(--hls)}
.inbox .meter{display:grid;gap:8px}
.toolbar{display:grid;gap:12px}
.toolrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px}
.search .i{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--dim)}
.search .field{padding-left:40px}
.toolrow select.field{width:auto;min-width:150px}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--a1);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bulk select.field{width:auto;min-height:38px}
.count{margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:6px 6px 10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--a1) 60%,var(--line))}
.card.on{border-color:var(--a1);box-shadow:0 0 0 2px var(--a1)}
.cmeta,.ctags{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.ctags{flex-direction:row;flex-wrap:wrap;gap:5px}
.handle{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnote.cap{font-style:italic}
.capq{display:grid;gap:4px;margin:0;padding:10px 14px;border-radius:12px;background:var(--panel2);font-size:14.5px;color:var(--ink)}
.cnote{padding:0 4px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.st-done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.st-try,.st-doing{color:var(--a3);border-color:color-mix(in srgb,var(--a3) 50%,transparent)}
.tick{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;border:2px solid #fff}
.card.on .tick{background:var(--a1);color:var(--on-a1);border-color:var(--a1)}
.tick .i{width:16px;height:16px}
.results.list .cards{grid-template-columns:minmax(0,1fr);gap:8px}
.results.list .card{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;row-gap:4px;padding:8px;align-items:center}
.results.list .card .cover{grid-row:1/3;aspect-ratio:1;width:56px}
.results.list .card .cover .mono{font-size:20px;left:6px;bottom:4px}
.results.list .card .cover .kind,.results.list .card .cover .rate{display:none}
.results.list .cmeta{flex-direction:row;gap:10px;align-items:baseline}
.results.list .cnote{grid-column:2;-webkit-line-clamp:1}
.results.list .tick{top:50%;translate:0 -50%}
.more{margin:18px auto 0;display:flex}
.empty{display:grid;gap:12px;justify-items:start;padding:28px;border:1px dashed var(--line);border-radius:var(--rl)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55)}
.drawer{position:fixed;z-index:41;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
@media(min-width:760px){.drawer{top:0;right:0;bottom:0;width:min(460px,100%);border-radius:var(--rl) 0 0 var(--rl);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
@media(max-width:759.98px){.drawer{left:0;right:0;bottom:0;max-height:92vh;border-radius:var(--rl) var(--rl) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.drawer-head .pos{flex:1;text-align:center}
.drawer-body{overflow-y:auto;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px}
.d-hero{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:start}

function levelInfo(xp) {

  while (rest >= need) { rest -= need; lv++; need = 100 + 60 * (lv - 1); }
  let title = TITLES[0][1], next = null;
  for (const [l, t] of TITLES) { if (lv >= l) title = t; else { next = [l, t]; break; } }
  return {lv, rest, need, title, next};
}
function curStreak() { const y = new Date(Date.now() - DAY * 1000); return (G.lastDay === dayKey(new Date()) || G.lastDay === dayKey(y)) ? G.streak : 0; }
let achBusy = false;
function award(xp, at, label) {

function fileCurrent(boardId, btn) {

  const t = Date.now(); SORT.combo = (t - SORT.lastAt < 6000) ? SORT.combo + 1 : 1; SORT.lastAt = t;

function monthSeries(items) {
  const m = new Map(); let lo = Infinity, hi = -Infinity;
  for (const it of items) { if (!it.savedAt) continue; const d = new Date(it.savedAt * 1000); const k = d.getFullYear() * 12 + d.getMonth(); m.set(k, (m.get(k) || 0) + 1); lo = Math.min(lo, k); hi = Math.max(hi, k); }
  if (!isFinite(lo)) return [];
  lo = Math.max(lo, hi - 47);
  const out = []; for (let k = lo; k <= hi; k++) { const y = Math.floor(k / 12), mo = k % 12; out.push({k, y, m: mo, n: m.get(k) || 0, label: new Date(y, mo, 1).toLocaleDateString(undefined, {month: 'short', year: 'numeric'})}); }
  return out;
}
const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, v)))); for (const k of [2, 4, 6, 8, 10]) if (k * p >= v) return k * p; return 10 * p; };
function drawMonths() {

  const max = Math.max(...data.map(d => d.n)), top = niceMax(max), bw = (W - L - R) / n, gap = bw > 8 ? 2 : 1;
  const y = v => T + (H - T - B) * (1 - v / top);
  const busiest = data.reduce((a, b) => b.n > a.n ? b : a);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saves per month from ${esc(data[0].label)} to ${esc(data[n - 1].label)}. Busiest month: ${esc(busiest.label)} with ${busiest.n}.">`;
  for (const t of [0, top / 2, top]) s += `<line class="${t ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtN(t)}</text>`;
  data.forEach((d, i) => {
    const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap), h = (H - T - B) * d.n / top, yy = H - B - h, r = Math.min(4, w / 2, h);
    s += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-i="${i}"/>`;
    if (d.n) s += `<path class="bar" data-i="${i}" d="M${x},${H - B}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${H - B}Z"/>`;
    else s += '<g></g>';
    if (n <= 14 ? true : d.m === 0) s += `<text class="ax" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${n <= 14 ? new Date(d.y, d.m, 1).toLocaleDateString(undefined, {month: 'short'}) : d.y}</text>`;
  });
  s += '</svg>';
  wrap.innerHTML = s + '<div class="tip" hidden></div>';
  const tip = $('.tip', wrap);
  const show = e => { const hit = e.target.closest('.hit'); $$('.bar.hl', wrap).forEach(b => b.classList.remove('hl')); if (!hit) { tip.hidden = true; return; } const i = +hit.dataset.i, d = data[i]; const bar = $(`.bar[data-i="${i}"]`, wrap); if (bar) bar.classList.add('hl'); tip.textContent = `${d.label}: ${plural(d.n, 'save')}`; tip.hidden = false; const bx = +hit.getAttribute('x') + bw / 2; tip.style.left = Math.max(70, Math.min(W - 70, bx)) + 'px'; tip.style.top = (y(d.n) - 8) + 'px'; };
  wrap.onmousemove = show; wrap.onmouseleave = () => { tip.hidden = true; $$('.bar.hl', wrap).forEach(b => b.classList.remove('hl')); };
  wrap.ontouchstart = e => show(e);
}

}

async function runImport(files, folder) {
  const big = files.find(f => /\.zip$/i.test(f.name) && f.size > 1.5e9);
  if (big) { UI.imp = {status: 'error', msg: `That ZIP is ${(big.size / 1e9).toFixed(1)} GB, too big to open in a browser. Unzip it and use “Choose an unzipped folder”, or request a new download with only Saved, Likes and Followers and following.`}; refreshImp(); return; }
  UI.imp = {status: 'reading', name: files.length === 1 ? files[0].name : plural(files.length, 'file')}; refreshImp();
  const res = newImport();
  try {
    for (const f of files) {
      const path = f.webkitRelativePath || f.name;
      if (/\.zip$/i.test(f.name) || f.type === 'application/zip') {
        if (!window.JSZip) throw new Error('The ZIP reader didn’t load. Check your connection, or unzip the file and choose the folder instead.');
        const zip = await window.JSZip.loadAsync(f);
        for (const z of Object.values(zip.files)) { if (z.dir) continue; const k = kindOf(z.name); if (k === 'html') { res.html++; continue; } if (!k) continue; try { addParsed(res, k, JSON.parse(fixJson(await z.async('string')))); } catch (e) { /* skip unreadable file */ } }
      } else if (/\.json$/i.test(f.name)) {
        let k = kindOf(path); if (!k && folder) continue;
        try { const j = JSON.parse(fixJson(await f.text())); k = k || sniff(j); if (k) addParsed(res, k, j); } catch (e) { /* skip */ }
      } else if (kindOf(path) === 'html') res.html++;
    }
  } catch (e) { UI.imp = {status: 'error', msg: e && e.message && !/^\w+Error/.test(e.message) ? e.message : 'Couldn’t open that file. Make sure it’s the ZIP Instagram emailed you, or the JSON files inside it.'}; refreshImp(); return; }
  const any = res.saved.length || res.cols.length || res.liked.length || res.followers || res.following;
  if (!any) { UI.imp = {status: 'error', msg: res.html ? 'This download is in HTML format. Request a new one and choose JSON as the format.' : 'No saved posts or follower lists in there. When you request the download, tick Saved, Likes and Followers and following.'}; refreshImp(); return; }
  UI.imp = {status: 'ready', res}; refreshImp();
}
const fixJson = t => t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t;
function refreshImp() { const el = $('#impres'); if (el) el.innerHTML = impHTML(); }
function mergeImport() {
  const r = UI.imp.res; const colsOn = $('#imp-cols') ? $('#imp-cols').checked : false; const rulesOn = $('#imp-rules') ? $('#imp-rules').checked : true;
  if (S.mode === 'demo') { S = blank(); G = G0(); SORT.built = false; SORT.undo = []; }
  let added = 0; const touched = [];
  for (const p of [...r.saved, ...r.cols]) {
    if (!p || !p.id) continue;
    let it = S.items.get(p.id);
    if (!it) { it = newItem(p); S.items.set(p.id, it); added++; }
    else { if (!it.author && p.author) it.author = p.author; if (p.ts && !it.savedAt) it.savedAt = p.ts; if (p.cap && !it.cap) it.cap = p.cap; }
    if (p.col && !it.cols.includes(p.col)) it.cols.push(p.col);
    touched.push(it);
  }
  let colBoards = 0;
  if (colsOn) {
    const map = new Map();
    for (const name of new Set(r.cols.map(c => c.col))) { const had = S.boards.length; map.set(name, addBoard(name, 0, true)); if (S.boards.length > had) colBoards++; }
    for (const it of touched) if (!it.board && !it.letGo && it.cols.length) { const b = map.get(it.cols[0]); if (b) { it.board = b.id; it.filedAt = it.savedAt || nowS(); } }
  }
  const ruled = rulesOn ? applyRules(touched) : 0;
  const people = (list, key) => { if (!list) return; for (const p of S.people.values()) p[key] = 0; for (const x of list) { const p = S.people.get(x.u) || newPerson(x.u); p[key] = x.ts || 1; S.people.set(x.u, p); } };
  people(r.following, 'fo'); people(r.followers, 'fr'); people(r.unfollowed, 'uf');
  if (r.close) for (const x of r.close) { const p = S.people.get(x.u); if (p) p.cf = true; }
  for (const [u, p] of S.people) if (!p.fo && !p.fr && !p.uf && !p.labels.length) S.people.delete(u);
  if (r.liked.length) {
    const top = [...countBy(r.liked, l => l.author)].filter(([a]) => a).sort((a, b) => b[1] - a[1]).slice(0, 20).map(([a, n]) => ({a, n}));
    S.liked = {total: r.liked.length, top};
  }
  S.importedAt = nowS(); S.mode = 'real'; SORT.built = false;
  markAll(); Store.flush();
  const parts = [`${plural(added, 'new save')} added`]; if (colBoards) parts.push(`${plural(colBoards, 'collection')} became boards`); if (ruled) parts.push(`${plural(ruled, 'save')} filed by your rules`);
  UI.imp = {status: 'merged', msg: parts.join(', ') + '.'};
  award(added ? 50 : 0); checkAch(); renderChrome(); refreshImp();
  if (added) confetti();
}
function addLinks() {

  const posts = lines.map(l => { const p = postFrom(l); if (!p) return null; const m = l.match(/instagram\.com\/([A-Za-z0-9._]{1,30})\/(?:p|reels?|tv)\//i); return {...p, author: m ? cleanUser(m[1]) : '', ts: nowS()}; }).filter(Boolean);
  if (!posts.length) { toast('No Instagram post or reel links found. They look like instagram.com/p/… or /reel/…'); return; }
  if (S.mode === 'demo') { S = blank(); G = G0(); SORT.built = false; toast('Started your own library'); }
  let n = 0; for (const p of posts) if (!S.items.has(p.id)) { S.items.set(p.id, newItem(p)); markItem(p.id); n++; }
  applyRules(posts.map(p => S.items.get(p.id)));
  S.mode = 'real'; markMeta(); SORT.built = false; ta.value = '';
  toast(n ? `Added ${plural(n, 'link')}. Find ${n === 1 ? 'it' : 'them'} in Unsorted.` : 'Those links are already in your library.');
  renderChrome(); vData();
}
let DLP = null;
async function offerFile(name, text, type) {
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await (DLP || (DLP = window.claude.use('downloads')));
    if (!dl) { toast('Downloads aren’t available in this view. Open the page in your browser to download.'); return; }
    try { const r = await dl.save({filename: name, data: new Blob([text], {type})}); if (r && r.status === 'saved') toast(`Saved ${name}`); }
    catch (e) { toast(e && e.code === 'declined' ? 'Download cancelled.' : 'Couldn’t download the file.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function backupJSON() { return JSON.stringify({app: 'savepoint', version: 1, exportedAt: new Date().toISOString(), meta: encMeta(), items: [...S.items.values()].map(enc), people: [...S.people.values()].map(encP)}); }
function csv() {
  const q = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['url', 'creator', 'type', 'saved_on', 'board', 'status', 'rating', 'tags', 'note', 'instagram_collections', 'let_go']];
  for (const it of S.items.values()) rows.push([postUrl(it), it.author, it.type, it.savedAt ? new Date(it.savedAt * 1000).toISOString().slice(0, 10) : '', (boardById(it.board) || {}).name || '', STATUS_NAME[it.status] === 'None' ? '' : STATUS_NAME[it.status], it.rating || '', it.tags.join(' '), it.note, it.cols.join('; '), it.letGo ? 'yes' : '']);
  return rows.map(r => r.map(q).join(',')).join('\n');
}
async function restore(file) {
  try {
    const j = JSON.parse(fixJson(await file.text()));
    if (!j || j.app !== 'savepoint' || !j.meta || !Array.isArray(j.items)) throw new Error('bad');
    hydrate({meta: Object.assign({}, j.meta, {mode: 'real'}), ib: [{rows: j.items}], pb: [{rows: j.people || []}]});
    S.mode = 'real'; SORT.built = false; markAll(); Store.flush();
    toast(`Restored ${plural(S.items.size, 'save')} and ${plural(S.boards.length, 'board')}.`); renderChrome(); vData();
  } catch (e) { toast('That file isn’t a Savepoint backup.'); }
}

});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { UI.q = t.value; UI.shown = 60; renderResults(); }
  else if (t.id === 'pq') { UI.pq = t.value; UI.pshown = 100; clearTimeout(t._t); t._t = setTimeout(() => { const pos = t.selectionStart; vPeople(); const n = $('#pq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* fine */ } } }, 160); }
  else if (t.id === 'd-note') { const it = S.items.get(UI.drawer); if (!it) return; const had = !!it.note; it.note = t.value.slice(0, 500); markItem(it.id); if (!had && it.note.trim()) { G.c.notes++; award(5, t, 'named'); touchDay(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fboard') { UI.fboard = t.value; UI.shown = 60; renderResults(); }
  else if (t.id === 'fsort') { UI.sort = t.value; renderResults(); }
  else if (t.id === 'sorder') { SORT.order = t.value; buildQueue(); renderStage(true); }
  else if (t.id === 'bulkmove' && t.value) { const b = t.value === '_none' ? null : t.value; let n = 0; for (const id of UI.sel) { const it = S.items.get(id); if (it && it.board !== b) { if (!it.board && b) { G.c.filed++; n++; } it.board = b; it.filedAt = b ? nowS() : 0; markItem(id); } } if (n) { touchDay(); award(5 * n); } toast(`Moved ${plural(UI.sel.size, 'save')}`); UI.sel.clear(); renderResults(); renderChrome(); }
  else if (t.id === 'impfile' && t.files.length) { runImport([...t.files], false); t.value = ''; }
  else if (t.id === 'impdir' && t.files.length) { runImport([...t.files].filter(f => kindOf(f.webkitRelativePath || f.name)), true); t.value = ''; }
  else if (t.id === 'restore' && t.files.length) { restore(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'newboard') { const b = addBoard($('#nb-name').value, UI.newColor); if (b) { toast(`Board “${b.name}” created`); touchDay(); } UI.newBoard = false; vBoards(); renderChrome(); }
  else if (f.id === 'boardedit') { const b = boardById(UI.boardId); const name = $('#be-name').value.trim().slice(0, 40); if (b && name) { b.name = name; markMeta(); } UI.boardEdit = false; vLibrary(); }
  else if (f.id === 'ruleform') { const a = cleanUser($('#r-a').value); const b = $('#r-b').value; if (!a) { toast('Type a creator’s Instagram name, like coastal.routes'); return; } S.rules[a] = b; const n = applyRules(); markMeta(); toast(`Rule added${n ? `, ${plural(n, 'save')} filed` : ''}`); if (n) { G.c.filed += n; award(5 * n); } vBoards(); renderChrome(); }
  else if (f.id === 'sortnb') { const b = addBoard($('#snb').value); SORT.newBoard = false; if (b) fileCurrent(b.id, null); else renderStage(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (UI.drawer) { closeDrawer(); return; } closeSkinMenu(); }
  const t = e.target;
  if (t.id === 'd-tag' && e.key === 'Enter') { e.preventDefault(); const it = S.items.get(UI.drawer); const v = t.value.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-').slice(0, 30); if (it && v && !it.tags.includes(v)) { it.tags.push(v); G.c.tagged++; award(3, t); itemChanged(it); renderDrawer(); setTimeout(() => { const n = $('#d-tag'); if (n) n.focus(); }, 10); } return; }
  if (UI.drawer && e.key === 'Tab') { const d = $('.drawer'); const f = $$('button:not([disabled]), a[href], input, textarea, select', d); const i = f.indexOf(document.activeElement); if (e.shiftKey ? i <= 0 : i === f.length - 1) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); } return; }
  if (UI.route !== 'sort' || UI.drawer || e.metaKey || e.ctrlKey || e.altKey) return;
  if (t.closest && t.closest('input,textarea,select')) { if (t.id === 's-note' && e.key === 'Enter') { e.preventDefault(); t.blur(); } return; }
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(k)) { const b = S.boards[+k - 1]; if (b) { e.preventDefault(); fileCurrent(b.id, $(`.bpad[data-b="${b.id}"]`)); } }
  else if (k === 's' || k === 'arrowright') { e.preventDefault(); skipCurrent(); }
  else if (k === 'l') { e.preventDefault(); letGoCurrent(); }
  else if (k === 'z') { e.preventDefault(); undo(); }
  else if (k === 'o') { const a = $('#s-open'); if (a) a.click(); }
});

/* =============== boot =============== */
applySkin(SET.skin);
S = makeDemo(); G = demoGame();
route();
Store.init().then(async () => {
  let data = null;
  try { data = await Store.loadAll(); } catch (e) { toast('Couldn’t load your saved library. Reload to try again.'); }
  UI.loading = false;
  if (data) { hydrate(data); SORT.built = false; }
  route(); setSave('idle');
});
})();
</script>
